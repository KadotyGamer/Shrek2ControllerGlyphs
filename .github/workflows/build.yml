name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DLL and run tests
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Shrek2ControllerGlyphs
          path: |
            build/XInput1_4.dll
            ShrekControllerGlyphs.ini
          if-no-files-found: error
